name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Integration smoke — unauthenticated request is refused (401)
        run: |
          # Self-contained: the server boots without the dev issuer because JWKS is only
          # fetched when a token is actually verified. An unauthenticated call must be rejected.
          node dist/index.js &
          SRV=$!
          sleep 1
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8970/mcp \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}')
          kill $SRV 2>/dev/null || true
          if [ "$CODE" != "401" ]; then
            echo "Expected 401 for an unauthenticated tools/list, got $CODE"; exit 1
          fi
          echo "Unauthenticated request correctly refused with 401."
